<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYFREDGLOBAL MACHINES | Website Code</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081522;color:#eaf0f5;font-family:Inter,Arial,sans-serif}.wrap{width:min(1200px,94%);margin:auto;padding:30px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.04em}.brand span{color:#d6a84f}.back{color:#fff;text-decoration:none;border:1px solid #41505d;padding:10px 14px;border-radius:8px}.intro{background:#102333;border:1px solid #263b4b;border-radius:14px;padding:22px;margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid #3b4e5e;background:#102333;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer}.tab.active{background:#d6a84f;color:#081522;border-color:#d6a84f;font-weight:800}.codebox{background:#050b10;border:1px solid #263b4b;border-radius:12px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0d1b27;border-bottom:1px solid #263b4b}.copy{background:#d6a84f;color:#081522;border:0;padding:8px 12px;border-radius:6px;font-weight:800;cursor:pointer}pre{margin:0;padding:20px;overflow:auto;min-height:600px;max-height:75vh;white-space:pre-wrap;word-break:break-word;color:#dce7ef;font:13px/1.6 Consolas,Monaco,monospace}#status{color:#9fb0bd;font-size:14px}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand">MAYFREDGLOBAL <span>MACHINES</span> — CODE</div><a class="back" href="./">← Back to website</a></div>
<div class="intro"><h1>Website Source Code</h1><p>View the current public code for the website. Select a file and copy its contents.</p><div id="status">Loading current files from GitHub…</div></div>
<div class="tabs"><button class="tab active" data-file="index.html">index.html</button><button class="tab" data-file="style.css">style.css</button><button class="tab" data-file="script.js">script.js</button><button class="tab" data-file="deploy-pages.yml">deploy-pages.yml</button></div>
<div class="codebox"><div class="bar"><strong id="filename">index.html</strong><button class="copy" id="copy">Copy code</button></div><pre><code id="code">Loading…</code></pre></div>
</div>
<script>
const base='https://raw.githubusercontent.com/princewill-spec31/mayfredglobalmachines/main/';
const files={'index.html':'index.html','style.css':'style.css','script.js':'script.js','deploy-pages.yml':'.github/workflows/deploy-pages.yml'};
let source='';
async function load(file){document.getElementById('filename').textContent=file;document.getElementById('code').textContent='Loading…';try{const res=await fetch(base+files[file]);if(!res.ok)throw new Error();source=await res.text();document.getElementById('code').textContent=source;document.getElementById('status').textContent='Showing the current version from GitHub main branch.'}catch(e){source='';document.getElementById('code').textContent='Unable to load this file right now.';document.getElementById('status').textContent='GitHub source could not be loaded.'}document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.file===file))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>load(b.dataset.file)));
document.getElementById('copy').addEventListener('click',async()=>{if(!source)return;try{await navigator.clipboard.writeText(source)}catch(e){}const b=document.getElementById('copy'),old=b.textContent;b.textContent='Copied!';setTimeout(()=>b.textContent=old,1200)});
load('index.html');
</script></body></html>
